        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/items/{id}/stocks:
    post:
      operationId: createStockTrack
      tags: [Stock]
      summary: Record a stock movement
      description: |
        Appends an `IN` or `OUT` stock track and updates the item balance.

        - `IN` adds `amount` to the balance and adds
          `amount x unit_price` to the item total.
        - `OUT` deduces value at the moving average cost. A request larger
          than the available balance is clamped to what is on hand, so the
          stored `amount` can be smaller than the requested one; the balance
          never goes below zero.
        - Omitting `supplier` stores `-`.

        Afterwards an activity log is emitted asynchronously and the low-stock
        checker runs; an alert is produced when the item has a threshold
        greater than zero and the new stock is at or below it.
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ItemIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockRequest"
            examples:
              stockIn:
                summary: Inbound
                value:
                  type: IN
                  amount: 50
                  unit_price: 12500
                  supplier: CV Pangan Sejahtera
              stockOut:
                summary: Outbound
                value:
                  type: OUT
                  amount: 24.5
                  unit_price: 12500
      responses:
        "200":
          description: Stock track created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockEnvelope"
              examples:
                default:
                  value:
                    status: 200
                    message: update stock item success
                    data:
                      id: 91
                      type: IN
                      amount: 50
                      previous_stock: 0
                      new_stock: 50
                      unit_price: 12500
                      total_price: 625000
                      supplier: CV Pangan Sejahtera
                      modified_by: Ridwan
                      created_at: "2026-10-01T02:05:00Z"
        "400":
          description: Invalid body, non-positive amount, or unknown stock type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badType:
                  value:
                    status: 400
                    error: invalid stock type
                badAmount:
                  value:
                    status: 400
                    error: amount must be greater than 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/items/{id}/stocks/{stock_id}:
    patch:
      operationId: updateStockTrack
      tags: [Stock]
      summary: Edit a stock movement
      description: >-
        Rewrites amount, unit price, and supplier of a single stock track and
        replays the MAC chain for the item, so every following track gets
        corrected balances and totals too.
