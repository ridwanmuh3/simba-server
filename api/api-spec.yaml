  # ───────────────────────────────────────────────────────────────────────────
  # Invoices
  # ───────────────────────────────────────────────────────────────────────────
  /api/items/invoices:
    post:
      operationId: generateInvoice
      tags: [Invoices]
      summary: Generate an invoice
      description: |
        Builds an invoice from the stock tracks matching `date_from` /
        `date_to` (or the explicit `stock_ids`), persists the invoice and its
        frozen line items, advances the document sequence, and streams the
        rendered PDF back.

        Blank fields are filled server-side: `company_name`,
        `company_address`, and `company_contact` fall back to the saved company
        profile, `invoice_no` and `po_no` fall back to the next document
        numbers, `stock_type` defaults to `OUT`, and `bank_account` defaults to
        the configured account.

        Because the response is a PDF, an empty selection is reported as `404`
        rather than an empty document.
      security:
        - cookieAuth: []
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateInvoiceRequest"
            examples:
              default:
                value:
                  invoice_no: INV-014
                  date: "2026-10-12"
                  po_no: PO-009
                  kebutuhan: Belanja harian
                  date_from: "2026-10-01"
                  date_to: "2026-10-12"
                  stock_type: OUT
                  receiver_name: Dapur Utara
