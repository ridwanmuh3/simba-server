  # ── Static Files ──────────────────────────────────────────────────────────

  /uploads/{filepath}:
    get:
      tags: [Finances]
      summary: Serve uploaded file
      description: |
        Serve a static uploaded file (proof images, etc.).

        Typical usage: use the `proof_image` path from a `FinanceResponse` directly
        as the URL to display the image.

        **Admin / Super Admin.**
      security:
        - cookieAuth: []
      parameters:
        - name: filepath
          in: path
          required: true
          description: File path relative to uploads directory
          schema:
            type: string
            example: "finances/proof-20260421-001.jpg"
      responses:
        "200":
          description: File content
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: File not found
          content:
            application/json:
              example:
                status: 404
                message: "file not found"
                data: null
                error: "file not found"
