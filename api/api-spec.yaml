        "200":
          description: Page of notifications with pagination metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListEnvelope"
              examples:
                default:
                  value:
                    status: 200
                    message: get notifications success
                    data:
                      - id: 87
                        type: LOW_STOCK
                        title: Stok Beras rendah
                        message: "Stok Beras tinggal 2.50 kg (threshold: 5.00)"
                        level: warning
                        is_read: false
                        meta_json: '{"item_id":"MBG-BHN-0001","current_stock":2.5000,"threshold":5.0000}'
                        created_at: "2026-10-12T04:15:00Z"
                    paging:
                      page: 1
                      size: 10
                      total_item: 1
                      total_page: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      tags: [Notifications]
      summary: Unread notification count
      description: Badge count of unread notifications visible to the caller.
      responses:
        "200":
          description: Unread counter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCountEnvelope"
              examples:
                default:
                  value:
                    status: 200
                    message: get unread count success
                    data:
                      count: 3
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [Notifications]
      summary: Mark all as read
      description: Marks every unread notification visible to the caller as read.
      security:
        - cookieAuth: []
        - csrfToken: []
      responses:
        "200":
          description: All notifications marked as read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoolEnvelope"
              examples:
                default:
                  value:
                    status: 200
                    message: all notifications marked as read
                    data: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [Notifications]
      summary: Mark one as read
      description: >-
        Marks a single notification as read. Notifications addressed to another
        user are not visible and are left untouched.
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - $ref: "#/components/parameters/NotificationIdParam"
      responses:
        "200":
          description: Notification marked as read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoolEnvelope"
        "400":
          description: Notification id is not a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badId:
                  value:
                    status: 400
                    error: invalid notification id
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/notifications/{id}:
    delete:
      operationId: deleteNotification
      tags: [Notifications]
      summary: Delete a notification
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - $ref: "#/components/parameters/NotificationIdParam"
      responses:
        "200":
          description: Notification deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoolEnvelope"
        "400":
          description: Notification id is not a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badId:
                  value:
                    status: 400
                    error: invalid notification id
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ───────────────────────────────────────────────────────────────────────────
  # Uploads
  # ───────────────────────────────────────────────────────────────────────────
  /uploads/{filepath}:
    get:
      operationId: getUploadedFile
      tags: [Uploads]
      summary: Serve an uploaded file
      description: >-
        Static delivery of stored files, currently the finance proof images
        referenced by `proof_image`. Interactive browsing is disabled and the
        browser cache is valid for 24 hours.
      parameters:
        - name: filepath
          in: path
          required: true
          description: Path below `/uploads`, for example `finances-proof/<uuid>.jpg`.
          schema:
            type: string
      responses:
        "200":
          description: File contents.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ───────────────────────────────────────────────────────────────────────────
  # WebSocket
  # ───────────────────────────────────────────────────────────────────────────
  /ws:
    get:
      operationId: connectWebSocket
      tags: [WebSocket]
      summary: Open the realtime socket
      description: |
        Upgrades the connection to WebSocket. The socket is bound        to the authenticated session: the `token` cookie must be valid **and**
        `current_dapur_id` must already be selected, otherwise the upgrade is
        rejected with `401` or `403`. Messages sent by the client are ignored.

        Server frames are JSON `EventPayload` objects. Known events:

        | `type`     | `data`                            | Emitted when |
        |------------|-----------------------------------|--------------|
        | `ACTIVITY` | `ActivityLog`                     | An audit trail entry is written (item or stock change) |
        | `LOW_STOCK`| `{item_id, item_name, current_stock, threshold, measure_unit}` | An item's stock falls to or below its threshold |

        The server pings every 54 seconds and drops the connection when no
        pong arrives within 60 seconds. Outbound frames are capped at 512 bytes.
      responses:
        "101":
          description: >-
            Switching protocols. The connection becomes a WebSocket carrying
            the JSON frames described by the `WsEvent` schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WsEvent"
        "400":
          description: The request was not a valid WebSocket upgrade.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >-
            No valid session. The access-token cookie is checked before the
            upgrade, and the socket is closed when the identity cannot be
            resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                middleware:
                  value:
                    status: 401
                    error: user unauthorized
                noSession:
                  value:
                    status: 401
                    error: authentication required
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: >-
        HttpOnly access-token cookie set by `POST /api/auth/login`. Valid for
        30 minutes; renew it with `POST /api/auth/refresh`.
    csrfToken:
      type: apiKey
      in: header
      name: X-Csrf-Token
      description: >-
        Double-submit CSRF token. Must equal the `csrf_` cookie value on every
        `POST`, `PUT`, `PATCH`, and `DELETE` request.

  headers:
    RequestId:
      description: >-
        Correlation id of the request, echoed back and written to every log
        line for it. Send `X-Request-ID` to choose your own value; a UUID is
        generated otherwise.
      schema:
        type: string

  parameters:
    ResetSecretHeader:
      name: X-Reset-Secret
      in: header
      required: true
      description: >-
        Must equal the server's `APP_RESET_SECRET` value. When the server has
        no secret configured the endpoint refuses every call with `401`.
      schema:
        type: string
    RefreshTokenCookie:
      name: refresh_token
      in: cookie
      required: true
      description: One-time-use refresh token issued at login.
      schema:
        type: string
    PageParam:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    SizeParam:
      name: size
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    UserIdParam:
      name: id
      in: path
      required: true
      description: User identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
    ItemIdParam:
      name: id
      in: path
      required: true
      description: >-
        Item identifier, for example `MBG-BHN-0001`. Fixed segments
        (`import`, `export`, `categories`, `stocks`, `invoices`) are matched
        before the id segment, so they are reserved and cannot be item ids.
      schema:
        type: string
        pattern: ^MBG-BHN-[0-9]+$
    StockIdParam:
      name: stock_id
      in: path
      required: true
      description: Stock track identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
    InvoiceIdParam:
      name: id
      in: path
      required: true
      description: Invoice identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
    FinanceIdParam:
      name: id
      in: path
      required: true
      description: Finance record identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
    NotificationIdParam:
      name: id
      in: path
      required: true
      description: Notification identifier.
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    MessageOk:
      description: Operation completed and the body only carries a status and message.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageEnvelope"
    BadRequest:
      description: >-
        Body, params, or query failed validation. The `error` member is an
        array of field-level validation messages.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validation:
              value:
                status: 400
                error:
                  - "Key: 'CreateUserRequest.Username' Error:Field validation for 'Username' failed on the 'min' tag"
    Unauthorized:
      description: Missing, invalid, or expired session.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            unauthorized:
              value:
                status: 401
                error: user unauthorized
    InvalidCredentials:
      description: The username/password pair did not match an account.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalid:
              value:
                status: 401
                error: invalid username or password
    Forbidden:
      description: >-
        Request rejected before the handler ran: role mismatch
        (`user forbidden`), missing dapur selection (`dapur not selected`), or
        CSRF validation failure (`invalid csrf token`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            role:
              value:
                status: 403
                error: user forbidden
            dapur:
              value:
                status: 403
                error: dapur not selected
            csrf:
              value:
                status: 403
                error: invalid csrf token
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
    NotFound:
      description: The requested record does not exist, or is outside the active dapur.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            notFound:
              value:
                status: 404
                error: item not found
    Conflict:
      description: A record with the same unique key already exists.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            duplicateUser:
              value:
                status: 409
                error: user already exists
    PayloadTooLarge:
      description: The request body exceeded the 15 MB server limit.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            tooLarge:
              value:
                status: 413
                error: Request Entity Too Large
    TooManyRequests:
      description: Login rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds until the current window expires.
          schema:
            type: string
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            limited:
              value:
                status: 429
                error: too many login attempts
    InternalServerError:
      description: >-
        Unexpected server failure. The client sees a generic message; the
        detail is only written to the server log.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            internal:
              value:
                status: 500
                error: internal server error

  schemas:
    # ── Envelope ────────────────────────────────────────────────────────────
    Envelope:
      type: object
      title: Response envelope
      description: >-
        Wrapper every endpoint answers with. `data` and `paging` accompany
        success, `error` accompanies failure.
      required: [status]
      properties:
        status:
          type: integer
          description: HTTP status code mirrored in the body.
        message:
          type: string
          description: Human-readable outcome, omitted when empty.
        data:
          description: Endpoint-specific payload, omitted when empty.
        paging:
          $ref: "#/components/schemas/Paging"
        error:
          $ref: "#/components/schemas/ErrorDetail"

    ErrorResponse:
      type: object
      title: Error envelope
      description: Body shape used for every non-2xx response.
      required: [status]
      properties:
        status:
          type: integer
          description: HTTP status code mirrored in the body.
        error:
          $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      description: >-
        A single message for handler errors, or an array of field validation
        messages when the request failed validation.
      oneOf:
        - type: string
        - type: array
          items:
            type: string

    Paging:
      type: object
      description: Pagination metadata attached to list responses.
      required: [page, size, total_item, total_page]
      properties:
        page:
          type: integer
          minimum: 1
          description: 1-based page number that was served.
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: Page size that was applied.
        total_item:
          type: integer
          format: int64
          description: Total number of matching rows.
        total_page:
          type: integer
          format: int64
          description: Total number of pages, `0` when there is no data.

    # ── Typed envelopes ─────────────────────────────────────────────────────
    MessageEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: "null"

    BoolEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: boolean

    CountEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: integer
              description: Number of rows affected.

    NumberEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: number

    StringListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                type: string

    CsrfEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CsrfToken"

    HealthEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/HealthStatus"

    AuthEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Auth"

    UserEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/User"

    UserListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/User"

    UserStatsEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/UserStats"

    DapurEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Dapur"

    DapurListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Dapur"

    ItemEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Item"

    ItemListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Item"

    StockEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Stock"

    StockListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Stock"

    ItemStockSummaryListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/ItemStockSummary"

    StocksFinanceSummaryEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/StocksFinanceSummary"

    InvoiceListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Invoice"

    InvoiceDetailEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/InvoiceDetail"

    InvoiceItemFlatListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/InvoiceItemFlat"

    FinanceEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Finance"

    FinanceListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Finance"

    DashboardEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/DashboardStats"

    CompanyProfileEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CompanyProfile"

    DocumentSequenceEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/DocumentSequence"

    NotificationListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Notification"

    UnreadCountEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/UnreadCount"

    # ── Domain models ───────────────────────────────────────────────────────
    CsrfToken:
      type: object
      properties:
        csrf_token:
          type: string
          description: Base64url-encoded 32-byte token, also stored in the `csrf_` cookie.

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        db:
          type: string
          description: Database probe result.
          enum: [connected, disconnected, not configured]
        uptime:
          type: string
          description: Process uptime, rounded to the second, for example `3h12m8s`.
        version:
          type: string

    Auth:
      type: object
      description: >-
        Authenticated identity. Access and refresh tokens travel only in
        HttpOnly cookies and never appear here.
      properties:
        id:
          type: integer
        fullname:
          type: string
        role:
          type: string
          enum: [Admin, Super Admin]
        current_dapur_id:
          type: [integer, "null"]
          description: Active dapur, `null` until `select-dapur` is called.

    User:
      type: object
      description: Fields with zero values are omitted from the response.
      properties:
        id:
          type: integer
        username:
          type: string
        fullname:
          type: string
        role:
          type: string
          enum: [Admin, Super Admin]
        is_active:
          type: boolean
          description: True while the user holds a live session.
        last_active:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    UserStats:
      type: object
      properties:
        users_total:
          type: integer
          format: int64
        users_super_admin_total:
          type: integer
          format: int64
        users_admin_total:
          type: integer
          format: int64
        users_active_total:
          type: integer
          format: int64

    Dapur:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    Item:
      type: object
      properties:
        id:
          type: string
          pattern: ^MBG-BHN-[0-9]+$
          description: Server-generated item code.
        name:
          type: string
        category:
          type: string
        stock:
          type: number
          description: Current balance, rounded to 4 decimals.
        initial_stock:
          type: number
        measure_unit:
          type: string
        unit_price:
          type: number
          description: Current moving average cost per unit.
        total_price:
          type: number
          description: Value of the remaining balance, rounded to 2 decimals.
        created_at:
          type: string
          format: date-time

    Stock:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [IN, OUT]
        amount:
          type: number
          description: Recorded movement. For `OUT`, clamped to the available balance.
        previous_stock:
          type: number
        new_stock:
          type: number
        unit_price:
          type: number
        total_price:
          type: number
          description: Value of this movement, rounded to 2 decimals.
        supplier:
          type: string
          description: Supplier name, or `-` when not provided.
        modified_by:
          type: string
          description: Full name of the acting user.
        created_at:
          type: string
          format: date-time
        item:
          $ref: "#/components/schemas/Item"

    ItemStockSummary:
      type: object
      properties:
        item_id:
          type: string
        name:
          type: string
        category:
          type: string
        initial_stock:
          type: number
        measure_unit:
          type: string
        total_in:
          type: number
        total_out:
          type: number
        current_stock:
          type: number
        buy_price:
          type: number
        sell_price:
          type: number
        stock_value:
          type: number

    StocksFinanceSummary:
      type: object
      properties:
        master_items_total_budget:
          type: number
        budget_in:
          type: number
        budget_out:
          type: number
        profit:
          type: number
        current_budget:
          type: number

    Invoice:
      type: object
      description: Stored invoice header. Line items live in `InvoiceDetail`.
      properties:
        id:
          type: integer
        stock_type:
          type: string
          enum: [IN, OUT]
          description: Stock direction the invoice was generated from.
        company_name:
          type: string
        company_contact:
          type: string
        company_address:
          type: string
        invoice_number:
          type: string
        po_number:
          type: string
        kebutuhan:
          type: string
        receiver_name:
          type: string
        receiver_address:
          type: string
        invoice_date:
          type: string
          description: Free-text date, as printed on the invoice.
        keterangan:
          type: string
        penanggungjawab:
          type: string
        jabatan:
          type: string
        bank_account:
          type: string
        has_items:
          type: boolean
          description: True when line items were stored and the PDF can be re-rendered.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InvoiceItem:
      type: object
      description: Frozen line item captured when the invoice was generated.
      properties:
        id:
          type: integer
        item_name:
          type: string
        category:
          type: string
        measure_unit:
          type: string
        amount:
          type: number
        unit_price:
          type: number
        total_price:
          type: number
        supplier:
          type: string
        stock_type:
          type: string
          enum: [IN, OUT]

    InvoiceDetail:
      allOf:
        - $ref: "#/components/schemas/Invoice"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/InvoiceItem"
            grand_total:
              type: number

    InvoiceItemFlat:
      type: object
      description: One stored invoice line, flattened across invoices.
      properties:
        date:
          type: string
        invoice_number:
          type: string
        item_name:
          type: string
        measure_unit:
          type: string
        amount:
          type: number
        stock_type:
          type: string
          enum: [IN, OUT]
        buy_price:
          type: number
        sell_price:
          type: number
        total_buy_price:
          type: number
        total_sell_price:
          type: number

    Finance:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [PEMASUKAN, PENGELUARAN]
          description: Income or expense.
        category:
          type: string
        description:
          type: string
        amount:
          type: integer
          description: Whole rupiah, no decimals.
        extra_note:
          type: string
        proof_image:
          type: string
          description: Public path to the uploaded proof, under `/uploads`.
        modified_by:
          type: string
        created_at:
          type: string
          format: date-time

    CompanyProfile:
      type: object
      properties:
        company_name:
          type: string
        company_address:
          type: string
        company_contact:
          type: string
        bank_account:
          type: string
        penanggungjawab:
          type: string
        jabatan:
          type: string

    DocumentSequence:
      type: object
      properties:
        next_invoice_no:
          type: string
          description: Zero-padded invoice number, for example `INV-014`.
        next_po_no:
          type: string
          description: Zero-padded purchase order number, for example `PO-009`.

    Notification:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          description: Event class, for example `LOW_STOCK`.
        title:
          type: string
        message:
          type: string
        level:
          type: string
          enum: [info, warning, critical]
        is_read:
          type: boolean
        actor_id:
          type: [integer, "null"]
          description: User who triggered the notification; `null` for system events.
        meta_json:
          type: string
          description: >-
            JSON-encoded metadata for the event, for example
            `{"item_id":"MBG-BHN-0001","current_stock":2.5,"threshold":5}`.
        created_at:
          type: string
          format: date-time

    UnreadCount:
      type: object
      properties:
        count:
          type: integer
          format: int64

    DashboardStats:
      type: object
      properties:
        total_items:
          type: integer
          format: int64
        stock_in:
          type: number
          description: Sum of all inbound stock amounts.
        stock_out:
          type: number
          description: Sum of all outbound stock amounts.
        total_budget:
          type: integer
          format: int64
          description: Total of the master item catalogue value.
        budget_in:
          type: integer
          format: int64
          description: Total income recorded in finances.
        budget_out:
          type: integer
          format: int64
          description: Total expenses recorded in finances.
        monthly_budget:
          type: array
          description: Monthly income and expense series for the dashboard chart.
          items:
            $ref: "#/components/schemas/MonthlyBudgetStat"
        expense_composition:
          type: array
          description: Expense totals grouped by category.
          items:
            $ref: "#/components/schemas/ExpenseComposition"
        system_activities:
          type: array
          description: Most recent audit trail entries for the dapur.
          items:
            $ref: "#/components/schemas/SystemActivity"

    MonthlyBudgetStat:
      type: object
      properties:
        month:
          type: string
          description: Month key in `YYYY-MM` form.
        in:
          type: integer
          format: int64
        out:
          type: integer
          format: int64

    ExpenseComposition:
      type: object
      properties:
        category:
          type: string
        amount:
          type: integer
          format: int64

    SystemActivity:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          examples: [ADD-ITEM, UPDATE-STOCK, EDIT-STOCK-IN, DELETE-ITEM, ADD-FINANCE, DELETE-FINANCE]
        title:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time

    # ── WebSocket events ────────────────────────────────────────────────────
    WsEvent:
      type: object
      title: WebSocket event
      description: Every frame pushed over `/ws`.
      properties:
        type:
          type: string
          enum: [ACTIVITY, LOW_STOCK]
        message:
          type: string
        data:
          oneOf:
            - $ref: "#/components/schemas/ActivityLog"
            - $ref: "#/components/schemas/LowStockEventData"

    ActivityLog:
      type: object
      description: >-
        Audit trail entry pushed with `type: ACTIVITY`. Stored permanently and
        also surfaced in the dashboard activity list.
      properties:
        ID:
          type: integer
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
        DeletedAt:
          type: [string, "null"]
          format: date-time
          description: Always `null`; entries are never soft deleted.
        Type:
          type: string
          examples: [ADD-ITEM, UPDATE-STOCK, EDIT-STOCK-IN, DELETE-ITEM, ADD-FINANCE, DELETE-FINANCE]
        Title:
          type: string
        Description:
          type: string
        ActionBy:
          type: string
          description: Full name of the acting user.
        DapurID:
          type: integer

    LowStockEventData:
      type: object
      description: "Payload pushed with `type: LOW_STOCK`."
      properties:
        item_id:
          type: string
        item_name:
          type: string
        current_stock:
          type: number
        threshold:
          type: number
        measure_unit:
          type: string

    # ── Requests ────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 5
          maxLength: 30
          pattern: ^[a-zA-Z0-9]+$
        password:
          type: string
          minLength: 4
          maxLength: 30
          description: Printable ASCII only.
        remember_me:
          type: boolean
          default: false

    CreateUserRequest:
      type: object
      required: [username, fullname, role, password]
      properties:
        username:
          type: string
          minLength: 5
          maxLength: 30
          pattern: ^[a-zA-Z0-9]+$
        fullname:
          type: string
          minLength: 2
          maxLength: 50
        role:
          type: string
          enum: [Admin, Super Admin]
        password:
          type: string
          description: >-
            Strong-password policy: 8-30 printable ASCII characters with at
            least one uppercase letter, one digit, and one symbol.
          minLength: 8
          maxLength: 30
          example: Rahasia#2026

    UpdateUserRequest:
      type: object
      description: Both members are optional; send only what changes.
      properties:
        fullname:
          type: string
          minLength: 2
          maxLength: 50
        old_password:
          type: string
          description: >-
            Replacement password. The field name is kept for client
            compatibility but it sets a new password, it is not checked
            against the current one.
          minLength: 8
          maxLength: 30
          example: Rahasia#2026

    ResetPasswordRequest:
      type: object
      required: [username, new_password]
      properties:
        username:
          type: string
          minLength: 5
          maxLength: 30
          pattern: ^[a-zA-Z0-9]+$
        new_password:
          type: string
          minLength: 8
          maxLength: 30
          example: Rahasia#2026

    CreateDapurRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 255

    UpdateDapurRequest:
      type: object
      description: Omitted members are left unchanged.
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 255
        is_active:
          type: boolean

    AddItemRequest:
      type: object
      required: [name, category, stock, measure_unit, unit_price]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 90
          description: Unique per dapur.
        category:
          type: string
          minLength: 1
          maxLength: 50
        stock:
          type: number
          exclusiveMinimum: 0
          description: Seeded into both `initial_stock` and `stock`.
        measure_unit:
          type: string
          minLength: 1
          maxLength: 30
        unit_price:
          type: number
          exclusiveMinimum: 0
        date_added:
          type: string
          format: date-time
          description: Overrides `created_at` when supplied.

    UpdateItemRequest:
      type: object
      description: >-
        All members are optional. `stock` is accepted for compatibility; the
        stored balance is always the MAC recalculation result.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 90
        category:
          type: string
          minLength: 1
          maxLength: 50
        measure_unit:
          type: string
          minLength: 1
          maxLength: 30
        unit_price:
          type: number
          exclusiveMinimum: 0
        stock:
          type: number
          exclusiveMinimum: 0
        initial_stock:
          type: number
          minimum: 0
        date_added:
          type: string
          format: date-time

    CreateStockRequest:
      type: object
      required: [type, amount, unit_price]
      properties:
        type:
          type: string
          enum: [IN, OUT]
        amount:
          type: number
          exclusiveMinimum: 0
        unit_price:
          type: number
          minimum: 1
        supplier:
          type: string
          maxLength: 100
          description: Stored as `-` when omitted.

    EditStockRequest:
      type: object
      required: [amount, unit_price]
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        unit_price:
          type: number
          exclusiveMinimum: 0
        supplier:
          type: string
          maxLength: 100

    GenerateInvoiceRequest:
      type: object
      description: >-
        `company_*`, `invoice_no`, `po_no`, and `bank_account` are filled from
        the company profile and document sequence when left blank.
      required: [penanggungjawab, jabatan, receiver_name, receiver_address]
      properties:
        company_name:
          type: string
          minLength: 2
          maxLength: 100
        company_address:
          type: string
          minLength: 2
          maxLength: 200
        company_contact:
          type: string
          minLength: 2
          maxLength: 100
        invoice_no:
          type: string
          minLength: 1
          maxLength: 50
        date:
          type: string
          description: >-
            Invoice date, free text in any format accepted by
            `FormatDateStringID`; the rendered PDF translates known English
            month names to Indonesian.
          example: "2026-10-12"
        po_no:
          type: string
          maxLength: 50
        kebutuhan:
          type: string
          maxLength: 50
        receiver_name:
          type: string
          minLength: 2
          maxLength: 100
        receiver_address:
          type: string
          minLength: 2
          maxLength: 200
        date_from:
          type: string
          description: Lower bound for the stock track selection.
        date_to:
          type: string
          description: Upper bound for the stock track selection.
        stock_ids:
          type: array
          description: Explicit stock track ids; takes precedence over the date range.
          items:
            type: integer
        stock_type:
          type: string
          enum: [IN, OUT]
          default: OUT
          description: Which stock direction to invoice.
        keterangan:
          type: string
          maxLength: 500
        penanggungjawab:
          type: string
          minLength: 2
          maxLength: 100
        jabatan:
          type: string
          minLength: 2
          maxLength: 100
        bank_account:
          type: string
          maxLength: 100
          description: Falls back to the configured bank account when blank.

    UpdateInvoiceRequest:
      type: object
      required: [company_name, company_address, company_contact]
      properties:
        company_name:
          type: string
          minLength: 2
          maxLength: 100
        company_address:
          type: string
          minLength: 2
          maxLength: 200
        company_contact:
          type: string
          minLength: 2
          maxLength: 100
        receiver_name:
          type: string
          maxLength: 100
        receiver_address:
          type: string
          maxLength: 200
        invoice_date:
          type: string
          maxLength: 100
        keterangan:
          type: string
          maxLength: 500
        penanggungjawab:
          type: string
          maxLength: 100
        jabatan:
          type: string
          maxLength: 100
        bank_account:
          type: string
          maxLength: 100
        stock_ids:
          type: array
          description: Replaces the stored line items.
          items:
            type: integer

    AddFinanceForm:
      type: object
      required: [type, description, amount, proof_image]
      properties:
        type:
          type: string
          enum: [PEMASUKAN, PENGELUARAN]
        category:
          type: string
          maxLength: 100
          description: >-
            Required for `PENGELUARAN`; the client sends `Pemasukan` for
            `PEMASUKAN`.
        description:
          type: string
          maxLength: 255
        amount:
          type: integer
          description: Whole rupiah, sent as a decimal string in the form field.
        extra_note:
          type: string
          maxLength: 255
        proof_image:
          type: string
          format: binary
          description: Proof image, `.png`, `.jpg`, or `.jpeg`, up to 15 MB.

    UpdateFinanceForm:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [PEMASUKAN, PENGELUARAN]
        category:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 255
        amount:
          type: integer
        extra_note:
          type: string
          maxLength: 255
        proof_image:
          type: string
          format: binary
          description: Omit to keep the stored image; a new file replaces and deletes the old one.

    CompanyProfileRequest:
      type: object
      required: [company_name, company_address, company_contact]
      properties:
        company_name:
          type: string
        company_address:
          type: string
        company_contact:
          type: string
        bank_account:
          type: string
          maxLength: 200
        penanggungjawab:
          type: string
          maxLength: 100
        jabatan:
          type: string
          maxLength: 100
