      operationId: downloadInvoicePdf
      tags: [Invoices]
      summary: Download an invoice PDF
      description: >-
        Re-renders the PDF from the stored invoice snapshot. Invoices saved
        before line items were persisted have nothing to render and answer
        `422`.
      parameters:
        - $ref: "#/components/parameters/InvoiceIdParam"
        - name: mode
          in: query
          required: false
          description: >-
            `view` renders inline in the browser; any other value (or omission)
            downloads the file.
          schema:
            type: string
            enum: [view, download]
      responses:
        "200":
          description: Rendered invoice PDF.
          headers:
            Content-Disposition:
              description: >-
                `inline` when `mode=view`, otherwise `attachment`, named
                `INVOICE-BARANG <KELUAR|MASUK>-<invoice_no>.pdf`.
              schema:
                type: string
            Access-Control-Expose-Headers:
              description: Always `Content-Disposition`.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Invoice id is not a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badId:
                  value:
                    status: 400
                    error: invalid invoice id
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The invoice has no stored line items and cannot be re-rendered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                noItems:
                  value:
                    status: 422
                    error: invoice tidak memiliki rincian bahan; tidak dapat diunduh ulang
        "500":
          $ref: "#/components/responses/InternalServerError"

