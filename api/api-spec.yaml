  /api/items/import:
    post:
      operationId: importItems
      tags: [Items]
      summary: Import items from CSV
      description: |
        Bulk-creates items from a CSV upload and returns the number of rows
        inserted. Accepted column order:

        `nama, kategori, stok, satuan, harga`

        A `sep=,` directive line and a header row (`nama` / `tanggal input`)
        are ignored. The file must have the `.csv` extension, stay at or below
        10 MB, and contain at most 500 data rows.
      security:
        - cookieAuth: []
        - csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [import_file]
              properties:
                import_file:
                  type: string
                  format: binary
                  description: CSV file to import.
      responses:
        "201":
          description: Rows imported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountEnvelope"
              examples:
                default:
                  value:
                    status: 201
                    message: items imported successfully
                    data: 128
        "400":
          description: >-
            Missing upload, malformed CSV, empty file, non-numeric stock or
            price, or more than 500 rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                rowLimit:
                  value:
                    status: 400
                    error: Jumlah baris melebihi batas maksimum 500 baris
                badRow:
                  value:
                    status: 400
                    error: "Baris 12: Format stok salah (harus angka)"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: Unsupported extension or oversized file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notCsv:
                  value:
                    status: 422
                    error: only accept csv format
                tooLarge:
                  value:
                    status: 422
                    error: system only accept uploaded file size below 10MB
        "500":
          $ref: "#/components/responses/InternalServerError"

