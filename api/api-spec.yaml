      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
        - name: is_read
          in: query
          required: false
          description: >-
            Filter by read state. `true` or `1` selects read, `false` selects
            unread, and omitting the parameter returns both.
          schema:
            type: string
            enum: ["true", "false", "1", "0"]
