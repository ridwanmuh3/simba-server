            examples:
              default:
                value:
                  amount: 48
                  unit_price: 12750
                  supplier: CV Pangan Sejahtera
      responses:
        "200":
          description: Stock track updated and MAC chain rebuilt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: deleteStockTrack
      tags: [Stock]
      summary: Delete a stock movement
      description: >-
