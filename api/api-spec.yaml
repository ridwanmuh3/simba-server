openapi: 3.2.1

info:
  title: SIMBA API
  summary: Backend API for koperasi stock, finance, and invoice management
  description: |
    SIMBA (Sistem Informasi Manajemen Anggaran dan Barang) — backend API for
    SPPG kitchen units (dapur) covering supply stock, finance records, and
    invoice generation.

    ## Base URL

    All JSON endpoints live under the `/api` prefix. Static uploads are served
    from `/uploads` and the realtime socket from `/ws` — both are **outside**
    the `/api` prefix.

    ## Authentication

    Login issues two HttpOnly cookies:

    | Cookie          | Path         | Lifetime | Purpose                                   |
    |-----------------|--------------|----------|-------------------------------------------|
    | `token`         | `/`          | 30 min   | Access token, read by every protected API |
    | `refresh_token` | `/api/auth`  | 7 days   | One-time-use refresh token                |

    `POST /api/auth/refresh` rotates **both** tokens; presenting a refresh
    token that has already been rotated fails and forces a re-login.

    Cookies are `SameSite=Strict` on HTTPS and `SameSite=Lax` on plain HTTP.
    Access tokens are also hashed at rest, so a session cannot be replayed from
    a leaked database row.

    ## CSRF

    `POST`, `PUT`, `PATCH`, and `DELETE` require the `X-Csrf-Token` header to
    match the `csrf_` cookie (double-submit, constant-time comparison). Fetch
    the pair from `GET /api/auth/csrf` first; the cookie is set on every
    response and the header is echoed in the response body as `csrf_token`.
    A missing or mismatching header yields `403 invalid csrf token`.

    ## Roles and tenancy

    Two roles exist: `Admin` and `Super Admin`.

    - `Super Admin` — user administration, dapur administration, everything an
      `Admin` can do.
    - `Admin` — dapur-scoped stock, finance, invoice, dashboard, and settings.

    Every dapur-scoped response is filtered by the caller's active
    `current_dapur_id`. Call `POST /api/auth/select-dapur` before touching
    those endpoints; without it the API answers `403 dapur not selected`.

    ## Pagination

    List endpoints accept `page` (default `1`, min `1`) and `size`
    (default `10`, min `1`, **max `100`**) and answer with a `paging` object
    next to `data`.

    ## Response envelope

    Every response body — success or error — is a JSON object with `status`,
    an optional `message`, and either `data` (plus `paging`) or `error`, where
    `error` carries a single message or an array of validation messages.
    Request validation failures arrive as `400` with those messages, never
    with an internal error string.

    ## Uploads and limits

    | Endpoint                  | Field        | Accepted types    | Max size |
    |---------------------------|--------------|-------------------|----------|
    | `POST /api/items/import`  | `import_file`| `.csv`            | 10 MB, 500 data rows |
    | `POST /api/finances`      | `proof_image`| `.png` `.jpg` `.jpeg` | 15 MB |
    | `PUT /api/finances/{id}`  | `proof_image`| `.png` `.jpg` `.jpeg` | 15 MB |

    Request bodies are capped at 15 MB overall. Uploaded proofs are stored
    under `uploads/finances-proof/` and referenced by `proof_image` as
    `/uploads/finances-proof/<uuid>.<ext>`.

    ## Rate limiting

    `POST /api/auth/login` allows 5 attempts per minute per
    `IP + normalized username`; the 6th answers `429` with `Retry-After`.
    A successful login clears one recorded attempt.
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  contact:
    name: SIMBA

servers:
  - url: https://simbambg.my.id
    description: Production
  - url: https://api.simbambg.my.id
    description: Production (API host)
  - url: http://localhost:3000
    description: Local development

security:
  - cookieAuth: []

tags:
  - name: Public
    summary: Public
    description: >
      Liveness and health endpoints. No authentication required.
    kind: nav
  - name: Authentication
    summary: Authentication
    description: >-
      Login, logout, session refresh, token rotation, active-dapur selection,
      and the secret-gated bootstrap endpoints.
    kind: nav
  - name: Management
    summary: Management
    description: Cross-cutting administrative surfaces.
    kind: nav
  - name: Users
    summary: Users
    description: User administration. Requires the `Super Admin` role.
    parent: Management
    kind: nav
  - name: Dapurs
    summary: Dapurs
    description: >-
      Kitchen/tenant administration. Reading requires any authenticated role;
      writing requires `Super Admin`.
    parent: Management
    kind: nav
  - name: Operations
    summary: Operations
    description: Day-to-day dapur workloads for Admin and Super Admin.
    kind: nav
  - name: Items
    summary: Items
    description: >-
      Master item catalogue and CSV bulk import/export. Item IDs follow the
      `MBG-BHN-NNNN` pattern and are generated server-side.
    parent: Operations
    kind: nav
  - name: Stock
    summary: Stock
    description: >-
      Stock movements. Balances and unit prices are derived with a moving
      average cost (MAC) recalculation over the full stock-track chain.
    parent: Operations
    kind: nav
  - name: Invoices
    summary: Invoices
    description: >-
      Invoice generation from stock tracks, stored invoice history, detail
      editing, and PDF rendering.
    parent: Operations
    kind: nav
  - name: Finances
    summary: Finances
    description: Income and expense records with a mandatory proof image.
    parent: Operations
    kind: nav
  - name: Dashboard
    summary: Dashboard
    description: Aggregated stock, budget, and recent-activity statistics.
    parent: Operations
    kind: nav
  - name: Settings
    summary: Settings
    description: Per-dapur company profile and the next invoice/PO sequence numbers.
    parent: Operations
    kind: nav
  - name: Uploads
    summary: Uploads
    description: >-
      Static delivery of stored proof images. Requires an authenticated
      `Admin` or `Super Admin` session.
    parent: Operations
    kind: nav
  - name: Realtime
    summary: Realtime
    description: Live push channel and persistent notification inbox.
    kind: nav
  - name: Notifications
    summary: Notifications
    description: >-
      Persistent inbox for dapur alerts. Notifications are currently produced
      by the low-stock checker when an item's stock drops to or below its
      threshold.
    parent: Realtime
    kind: nav
  - name: WebSocket
    summary: WebSocket
    description: WebSocket upgrade for realtime activity and low-stock events.
    parent: Realtime
    kind: nav

paths:
  # ───────────────────────────────────────────────────────────────────────────
  # Public
  # ───────────────────────────────────────────────────────────────────────────
  /:
    get:
      operationId: getWelcome
      tags: [Public]
      summary: Welcome message
      description: Returns a static banner. Useful to confirm the process is up.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/MessageOk"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /health:
    get:
      operationId: getHealth
      tags: [Public]
      summary: Health check
      description: >-
        Reports process liveness plus a database connectivity probe. Always
        answers `200`; read `data.status` for `healthy` / `unhealthy`.
      security: []
      responses:
        "200":
          description: Liveness, database state, uptime, and API version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
              examples:
                healthy:
                  summary: Database reachable
                  value:
                    status: 200
                    message: API is running
                    data:
                      status: healthy
                      db: connected
                      uptime: 3h12m8s
                      version: 1.0.0
                unhealthy:
                  summary: Database unreachable
                  value:
                    status: 200
                    message: API is running
                    data:
                      status: unhealthy
                      db: disconnected
                      uptime: 12s
                      version: 1.0.0
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ───────────────────────────────────────────────────────────────────────────
  # Authentication
  # ───────────────────────────────────────────────────────────────────────────
  /api/auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [Authentication]
      summary: Issue a CSRF token
      description: >-
        Reads the `csrf_` cookie, generating one when absent, and returns the
        token to be sent back as `X-Csrf-Token` on every mutating request.
        Safe to call repeatedly.
      security: []
      responses:
        "200":
          description: CSRF token, also set as the `csrf_` cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfEnvelope"
              examples:
                default:
                  value:
                    status: 200
                    message: csrf token success
                    data:
                      csrf_token: 7dGZ0mQ1sJQ9Kx2vV1e5yR8nL3pA6cT4uB0wZ2hF9dM
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: Log in
      description: |
        Authenticates by username and password, then sets the `token` and
        `refresh_token` cookies. Tokens are returned hashed at rest and are
        **not** included in the JSON body.

        Rate limited to 5 attempts per minute per `IP + normalized username`.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              default:
                value:
                  username: adminspgg
                  password: Rahasia#2026
                  remember_me: false
      responses:
        "200":
          description: Session established; both auth cookies are set.
          headers:
            Set-Cookie:
              description: >-
                `token` (path `/`, 30 min) and `refresh_token` (path
                `/api/auth`, 7 days), both HttpOnly.
              schema:
                type: array
                items:
                  type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
              examples:
                default:
                  value:
                    status: 200
                    message: user login success
                    data:
                      id: 1
                      fullname: Ridwan
                      role: Super Admin
                      current_dapur_id: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/auth/refresh:
    post:
      operationId: refreshSession
      tags: [Authentication]
      summary: Refresh the session
      description: >-
        Rotates the access and refresh tokens using the `refresh_token` cookie
        (one-time use). Cookies are cleared when the presented token is
        unknown, expired, or already rotated, and the response is `401`.
      security:
        - csrfToken: []
      parameters:
        - $ref: "#/components/parameters/RefreshTokenCookie"
      responses:
        "200":
          description: New token pair; both auth cookies are re-set.
          headers:
            Set-Cookie:
              description: Rotated `token` and `refresh_token` cookies.
              schema:
                type: array
                items:
                  type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/auth/logout:
    delete:
      operationId: logout
      tags: [Authentication]
      summary: Log out
      description: >-
        Clears the stored token hashes and invalidates both cookies, so any
        previously issued access or refresh token is dead immediately.
      security:
        - cookieAuth: []
        - csrfToken: []
      responses:
        "200":
          description: Session invalidated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoolEnvelope"
              examples:
                default:
                  value:
                    status: 200
                    message: user logout success
                    data: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/auth/_current:
    get:
      operationId: getCurrentAuthUser
      tags: [Authentication]
      summary: Current session
      description: >-
        Returns the authenticated user together with the active dapur, without
        the token cookies. Handy for bootstrapping the client shell.
      responses:
        "200":
          description: Authenticated identity and active dapur.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
              examples:
                default:
                  value:
                    status: 200
                    message: get current auth user success
                    data:
                      id: 1
                      fullname: Ridwan
                      role: Super Admin
                      current_dapur_id: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/auth/heartbeat:
    patch:
      operationId: heartbeat
      tags: [Authentication]
      summary: Heartbeat
      description: >-
        Refreshes `last_active` for the authenticated user. Used by the web
        client to keep the online indicator truthful.
      security:
        - cookieAuth: []
        - csrfToken: []
      responses:
        "200":
          $ref: "#/components/responses/MessageOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/auth/reset-password:
    post:
      operationId: resetPassword
      tags: [Authentication]
      summary: Reset a password
      description: |
        Operator escape hatch for locked-out accounts. Disabled unless
        `APP_RESET_SECRET` is configured on the server; when enabled the caller
        must present that value in `X-Reset-Secret`.

        The new password must satisfy the strong-password policy and every
        existing session for the user is invalidated.
      security:
        - csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ResetSecretHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password replaced and user sessions invalidated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              examples:
                default:
                  value:
                    status: 200
                    message: password reset success, user session invalidated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/auth/register:
    post:
      operationId: registerUser
      tags: [Authentication]
      summary: Register a user (secret-gated)
      description: >-
        Creates a user without an authenticated session. Disabled unless
        `APP_RESET_SECRET` is configured, and gated by the `X-Reset-Secret`
        header. Prefer `POST /api/users` for routine administration.
      security:
        - csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ResetSecretHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/auth/select-dapur:
    post:
      operationId: selectDapur
      tags: [Authentication]
      summary: Select the active dapur
      description: >-
        Binds the authenticated user to a dapur. The dapur must exist and be
        active. Required before calling any dapur-scoped endpoint.
      security:
        - cookieAuth: []
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dapur_id]
              properties:
                dapur_id:
                  type: integer
                  format: int64
                  minimum: 1
            examples:
              default:
                value:
                  dapur_id: 1
      responses:
        "200":
          $ref: "#/components/responses/MessageOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            `invalid csrf token`, `dapur is not active`, or the caller has no
            active session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                inactive:
                  value:
                    status: 403
                    error: dapur is not active
        "404":
          description: Dapur or user not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                dapurNotFound:
                  value:
                    status: 404
                    error: dapur not found
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ───────────────────────────────────────────────────────────────────────────
  # Users
  # ───────────────────────────────────────────────────────────────────────────
  /api/users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: List users
      description: Paginated user list, optionally filtered by full name.
      responses:
        "200":
          description: Page of users with pagination metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListEnvelope"
              examples:
                default:
                  value:
                    status: 200
                    message: find all users success
                    data:
                      - id: 1
                        username: admin.sppg
                        fullname: Ridwan
                        role: Super Admin
                        is_active: true
                        last_active: "2026-10-12T08:31:02Z"
                        created_at: "2026-04-18T02:10:00Z"
                    paging:
                      page: 1
                      size: 10
                      total_item: 1
                      total_page: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      parameters:
        - name: fullname
          in: query
          required: false
          description: Case-insensitive partial match on full name.
          schema:
            type: string
            maxLength: 30
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"

    post:
      operationId: createUser
      tags: [Users]
      summary: Create a user
      description: >-
        Creates a user. `role` accepts exactly `Admin` or `Super Admin`;
        `password` must satisfy the strong-password policy.
      security:
        - cookieAuth: []
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            examples:
              default:
                value:
                  username: dapurutara
                  fullname: Dapur Utara
                  role: Admin
                  password: Rahasia#2026
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
              examples:
                default:
                  value:
                    status: 201
                    message: create user success
                    data:
                      id: 7
                      username: dapurutara
                      fullname: Dapur Utara
                      role: Admin
                      is_active: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users/stats:
    get:
      operationId: getUserStats
      tags: [Users]
      summary: User statistics
      description: Totals per role plus the number of users seen as active.
      responses:
        "200":
          description: Aggregate counters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStatsEnvelope"
              examples:
                default:
                  value:
                    status: 200
                    message: get users statistics success
                    data:
                      users_total: 12
                      users_super_admin_total: 2
                      users_admin_total: 10
                      users_active_total: 4
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users/{id}:
    get:
      operationId: getUserById
      tags: [Users]
      summary: Get a user
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      responses:
        "200":
          description: User detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      operationId: updateUser
      tags: [Users]
      summary: Update a user
      description: >-
        Updates the full name and, when supplied, replaces the password. Both
        fields are optional; send only what changes.
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
            examples:
              default:
                value:
                  fullname: Dapur Utara Rev
                  old_password: Rahasia#2026
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: deleteUser
      tags: [Users]
      summary: Delete a user
      description: >-
        Soft deletes a user. A user cannot delete their own account, and the
        last remaining `Super Admin` cannot be deleted.
      security:
        - cookieAuth: []
        - csrfToken: []
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      responses:
        "200":
          description: User deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoolEnvelope"
        "400":
          description: Invalid id, or the caller tried to delete their own account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                selfDelete:
                  value:
                    status: 400
                    error: cannot self delete user
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Caller is not a Super Admin, or the target is the only remaining
            Super Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                lastSuperAdmin:
                  value:
                    status: 403
                    error: cannot delete super admin user if exists only one
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ───────────────────────────────────────────────────────────────────────────
  # Dapurs
  # ───────────────────────────────────────────────────────────────────────────
  /api/dapurs:
    get:
      operationId: listDapurs
      tags: [Dapurs]
      summary: List dapurs
      description: All dapurs, active and inactive. Any authenticated role may read.
      responses:
        "200":
          description: Dapur list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DapurListEnvelope"
              examples:
                default:
                  value:
                    status: 200
                    message: list dapurs success
                    data:
                      - id: 1
                        name: SPPG Dewa Makmur
                        description: Dapur utama
                        is_active: true
                        created_at: "2026-04-18T02:10:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: createDapur
      tags: [Dapurs]
      summary: Create a dapur
      description: Creates an active dapur. Names are unique.
      security:
